<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title">
  <title id="title">Stormtrace: storm cloud and lightning over radar rings and a hazard trace</title>
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#12304f"/>
      <stop offset="1" stop-color="#07101d"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3d9cff" stop-opacity="0"/>
      <stop offset="1" stop-color="#3d9cff" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#b9cde3"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="48"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="48" fill="url(#sky)"/>
  <g clip-path="url(#tile)">
    <!-- Radar: monitoring rings and a sweep centred under the storm. -->
    <g fill="none" stroke="#3d9cff" stroke-width="3">
      <circle cx="128" cy="136" r="104" opacity="0.28"/>
      <circle cx="128" cy="136" r="74" opacity="0.4"/>
    </g>
    <path d="M128 136 L128 32 A104 104 0 0 1 218 84 Z" fill="url(#sweep)"/>
    <!-- Trace: a recorded signal with a spike, for history and wider hazards. -->
    <path d="M18 196 H86 L98 182 L110 214 L122 172 L134 204 L144 196 H238" fill="none" stroke="#68d8f2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(10 0)">
  <!-- Storm cloud. -->
  <path d="M78 132 a30 30 0 0 1 4-59.6 a40 40 0 0 1 76.2-8.2 a28 28 0 0 1 21.8 47.8 a20 20 0 0 1-14 20 Z" fill="url(#cloud)" stroke="#07101d" stroke-width="6" stroke-linejoin="round"/>
  <!-- Lightning, in the map's fresh-strike yellow. -->
  <path d="M132 112 L104 166 H126 L114 214 L162 148 H138 L152 112 Z" fill="#ffe600" stroke="#07101d" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
